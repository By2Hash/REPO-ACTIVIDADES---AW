<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>

    <link rel="stylesheet" href="./recursos/css/index.css">
    <link rel="icon" href="./recursos/imagenes/icono.ico.png">
</head>
<body>
     <header class="encabezado_principal">
         <nav>
            <img src="./recursos/imagenes/logo-rs.svg" alt="logo de retiro sustentable">
            <ul>
                <li><a href="index.html">Volver al inicio</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido_principal">
        <h1>Reservas</h1>
        <h4>Contactanos</h4>

        <form method="POST" action="reservar.php">
            <div>
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej: Bautista Pereiro" name="nombre" required>
            </div>
            <br>

            <div>
                <label for="email">Email de Contacto:</label>
                <input type="email" id="email" name="email" placeholder="Ej: tu@gmail.com" required>
            </div>
            <br>

            <div>
                <label for="telefono">Teléfono de Contacto:</label>
                <input type="tel" id="telefono" placeholder="3123123123" name="telefono">
            </div>
            <br>

            <div>
                <label for="tipo_cabaña">Seleccionar cabaña:</label>
               
                <select id="tipo_cabaña" name="tipo_cabaña" required>
                    <option value="">Selecciona una opción</option>
                    <option value="1">Cabaña 1: Vista al Bosque</option>
                    <option value="2">Cabaña 2: Refugio del Lago</option>
                    <option value="3">Cabaña 3: La Cima</option>
                    <option value="4">Cabaña 4: Sendero Verde</option>
                </select>
            </div>
            <br>

            <button type="submit">Enviar mi Consulta</button>
            <button type="reset">Limpiar Formulario</button>
        </form>
    </main>

    <footer class="pie_pagina">
        <div>
            <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
